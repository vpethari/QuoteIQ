services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quoteiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quoteiq_dev}
      POSTGRES_DB: ${POSTGRES_DB:-quoteiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quoteiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quoteiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quoteiq_dev}
      POSTGRES_DB: ${POSTGRES_DB:-quoteiq}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quoteiq}:${POSTGRES_PASSWORD:-quoteiq_dev}@db:5432/${POSTGRES_DB:-quoteiq}
      CATALOG_EXCEL_PATH: /data/Atkorepartsfile.xlsx
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  quoteiq_pgdata:
